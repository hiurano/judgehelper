<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Помощник секретаря</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#232A2E">

    <!-- iOS-specific -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Протокол">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
<div id="global-dropzone">
    <h2>Бросайте файлы сюда</h2>
</div>
<div class="container">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;margin-bottom:2rem">
        <div style="min-width:0;flex:1">
            <h1>Помощник секретаря</h1>
        </div>
        <div style="display:flex;gap:0.5rem;flex-shrink:0;position:relative;align-items:center">
            <a href="/logout" id="logout-link">Выйти</a>
        </div>
    </div>

    <!-- IDLE: pick file(s) -->
    <div class="card" id="upload-card">
        <div id="drop-zone">
            <p>Перетащите файлы сюда</p>
            <p class="hint">mp3 · wav · m4a · mp4 · ogg · webm</p>
            <input type="file" id="file-input" accept="audio/*,video/mp4,.m4a,.webm" multiple>
        </div>
        <div class="row">
            <button id="pick-btn" class="secondary big">Выбрать файл(ы)</button>
        </div>
    </div>

    <!-- QUEUE -->
    <div class="card" id="queue-card" hidden>
        <h2 id="queue-title">Обработка</h2>
        <div id="queue-list"></div>
        <div style="margin-top: 1rem;">
            <button id="add-more-btn" class="secondary" style="width: 100%;">+ Добавить ещё файл</button>
        </div>
        <div id="staged-bar-container" style="margin-top: 1.25rem;"></div>
    </div>

</div>

<script src="/static/app.js?v=14"></script>
</body>
</html>

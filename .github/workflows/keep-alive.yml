name: Keep Alive Render Backend

on:
  schedule:
    # Run every 12 minutes (Render spins down after 15 minutes of inactivity)
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            URL="https://srv-d9361hmgvqtc73a31ukg.onrender.com"
          fi
          echo "Pinging ${URL}/health at $(date -u)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${URL}/health" || echo "failed")
          echo "Response HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Server is alive and responsive."
          else
            echo "⚠️ Non-200 status or timeout, but server was pinged to wake it up."
          fi

name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend

      # deploy.sh only ever asks the backend whether it is ready, from inside
      # its own container, so a Caddyfile that fails to parse would take the
      # public site down while the rollout still reported success.
      - name: Validate the Caddy configuration
        run: |
          docker run --rm \
            -e CADDY_DOMAIN=example.test \
            -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            caddy:2.11.4-alpine \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      # Validation only proves the file parses. These headers are the whole
      # point of the proxy config, so check they survive into the real config.
      - name: Check the security headers are configured
        run: |
          adapted="$(docker run --rm \
            -e CADDY_DOMAIN=example.test \
            -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            caddy:2.11.4-alpine \
            caddy adapt --adapter caddyfile --config /etc/caddy/Caddyfile)"
          for header in Content-Security-Policy Strict-Transport-Security \
                        X-Content-Type-Options Referrer-Policy Permissions-Policy; do
            if ! printf '%s' "$adapted" | grep -q "$header"; then
              echo "::error::$header is missing from the adapted Caddy config"
              exit 1
            fi
          done
          echo "All expected security headers are present."

      - name: Run Pytest suite
        run: |
          pytest -v

  deploy:
    # Only once the suite is green, and never from a pull request.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never let two deploys overlap. Queue rather than cancel, so a rollout
    # already touching production is left to finish or roll itself back.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never accept an unknown one unattended.
          printf '%s\n' \
            "82.40.57.223 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILdPcKk9qqKD26umy2Df9n+Z2FefK+DHIuik/WXCFb3T" \
            > ~/.ssh/known_hosts

      - name: Deploy to production
        # authorized_keys pins this key to a forced command, so the server
        # decides what runs; nothing is passed from here.
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              deploy@82.40.57.223

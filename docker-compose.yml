services:
  judge-helper:
    build:
      context: .
      dockerfile: Dockerfile
      # NixOS/Tailscale may expose MagicDNS only on the host namespace.
      network: host
    # Explicit tag so deploy.sh can keep the previous build under a rollback
    # tag and point this one back at it when a rollout fails.
    image: judge-helper:latest
    container_name: judge-helper
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ${ENV_FILE:-.env}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${HOST_DATA_DIR:-./backend/data}:/app/backend/data
      - ${HOST_LOGS_DIR:-./backend/logs}:/app/backend/logs
      - ${PROMPT_FILE:-./prompts/system-protocol.md}:/app/prompts/system-protocol.md:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.11.4-alpine
    container_name: judge-helper-caddy
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN must be set}
    depends_on:
      judge-helper:
        condition: service_healthy
    volumes:
      # The directory, not the file: a single-file bind mount follows the
      # inode, and `git pull` replaces the file rather than rewriting it, so
      # the container would keep serving the config from the previous commit.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy_data:
  caddy_config:

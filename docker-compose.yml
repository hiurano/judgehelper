services:
  judge-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judge-helper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs

  caddy:
    image: caddy:latest
    container_name: judge-helper-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from 34.42.63.241.sslip.io --to judge-helper:8000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

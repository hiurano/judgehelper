services:
  - type: web
    name: judge-helper
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      # SQLite job-store. На free тарифе диск эфемерный — DB живёт только
      # пока сервис не уходит в cold start. Для полной durability примонтируй
      # persistent disk (Render Starter+) и поставь DB_PATH в его mountPath.
      # См. docs/deploy.md "Персистентность задач".
      # - key: DB_PATH
      #   value: /var/data/jobs.db
      # - key: JOB_TTL_DAYS
      #   value: "30"
